name: ChatGPT bind phone

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: '用于 run-name 的提交主题（非敏感）'
        required: true
        type: string
      accounts:
        description: '多个账号用英文分号 ; 分隔（也兼容换行）：email----password----2fa'
        required: true
        type: string
      enable_711_proxy:
        description: '启用 711Proxy 住宅代理（关闭则直连）'
        required: false
        default: false
        type: boolean
      proxy_region:
        description: '代理地区码（如 JP/PH；启用代理时必填）'
        required: false
        default: ''
        type: string
      proxy_username:
        description: '711Proxy 账号（与密码一起时走 sticky 拼装）'
        required: false
        default: ''
        type: string
      proxy_password:
        description: '711Proxy 密码'
        required: false
        default: ''
        type: string
      proxy_links:
        description: '代理链接列表（每行一条；多账号按序号轮询；失败不换 sticky）'
        required: false
        default: ''
        type: string
      hold_minutes:
        description: '绑定成功后保持分钟数'
        required: false
        default: '15'
        type: choice
        options:
          - '0'
          - '5'
          - '10'
          - '15'
          - '30'
      hero_sms_api_key:
        description: 'Hero SMS API Key'
        required: true
        type: string
      hero_sms_service:
        description: 'Hero SMS 服务码'
        required: true
        type: string
      hero_sms_country:
        description: 'Hero SMS 国家 ID'
        required: true
        type: string
      web_task_id:
        description: '网页控制台任务 ID'
        required: false
        default: ''
        type: string

run-name: ${{ inputs.commit_message }}

jobs:
  call:
    uses: ./.github/workflows/chatgpt-task.yml
    permissions:
      contents: read
      actions: write
    with:
      mode: bind_phone
      commit_message: ${{ inputs.commit_message }}
      accounts: ${{ inputs.accounts }}
      enable_711_proxy: ${{ inputs.enable_711_proxy }}
      proxy_region: ${{ inputs.proxy_region }}
      proxy_username: ${{ inputs.proxy_username }}
      proxy_password: ${{ inputs.proxy_password }}
      proxy_links: ${{ inputs.proxy_links }}
      hold_minutes: ${{ inputs.hold_minutes }}
      payment_link_type: '未选择'
      payment_card: ''
      gc_ph_api_key: ''
      hero_sms_api_key: ${{ inputs.hero_sms_api_key }}
      hero_sms_service: ${{ inputs.hero_sms_service }}
      hero_sms_country: ${{ inputs.hero_sms_country }}
      web_task_id: ${{ inputs.web_task_id }}
    secrets: inherit
