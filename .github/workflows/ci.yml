name: ChatGPT register

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '多个账号用英文分号 ; 分隔（也兼容换行）：Outlook 邮箱----密码----client_id----refresh_token，或 iCloud 邮箱----API_KEY/网页取件链接'
        required: true
        type: string
      enable_mfa:
        description: '注册后开启 ChatGPT 两步验证'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.matrix.outputs.ids }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        name: 校验账号并生成矩阵
        shell: python
        env:
          ACCOUNTS: ${{ inputs.accounts }}
        run: |
          import json
          import os
          import sys

          sys.path.insert(0, '.github/scripts')
          from account_input import parse_accounts

          try:
              accounts = parse_accounts(os.environ['ACCOUNTS'])
          except ValueError as error:
              raise SystemExit(str(error)) from None

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('ids=' + json.dumps(list(range(len(accounts))), separators=(',', ':')) + '\n')

  register:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        account_index: ${{ fromJson(needs.prepare-matrix.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取并保护账号配置
        id: account
        shell: python
        env:
          ACCOUNTS: ${{ inputs.accounts }}
          ACCOUNT_INDEX: ${{ matrix.account_index }}
        run: |
          import os
          import sys

          sys.path.insert(0, '.github/scripts')
          from account_input import parse_accounts

          fields = parse_accounts(os.environ['ACCOUNTS'])[int(os.environ['ACCOUNT_INDEX'])]
          names = ['EMAIL', 'ICLOUD_API_KEY'] if len(fields) == 2 else ['EMAIL', 'EMAIL_PASSWORD', 'CLIENT_ID', 'REFRESH_TOKEN']

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              for name, value in zip(names, fields):
                  print(f'::add-mask::{value}')
                  env_file.write(f'{name}<<__ACCOUNT_VALUE__\n{value}\n__ACCOUNT_VALUE__\n')

      - name: 构建并运行 ChatGPT 注册
        env:
          ENABLE_CHATGPT_MFA: ${{ inputs.enable_mfa }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          ACCOUNT_RESULT_PATH: step-summary
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install
          npm run build
          timeout -k 30s 300s node dist/app.js

      - name: 上传账号结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-summary-${{ matrix.account_index }}
          path: step-summary
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传注册过程证据
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.account_index }}
          path: evidence/
          retention-days: 7

  collect-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: register
    steps:
      - name: 下载所有账号结果
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: step-summary-*
          path: summaries

      - name: 合并结果
        shell: python
        run: |
          import os
          from pathlib import Path

          results = []
          for path in sorted(Path('summaries').rglob('step-summary')):
              if path.is_file():
                  for line in path.read_text(encoding='utf-8').splitlines():
                      if line.strip():
                          results.append(line.strip())

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              if results:
                  summary.write('\n'.join(results) + '\n')
