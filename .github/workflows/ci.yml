name: ChatGPT register

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '多个账号用英文分号 ; 分隔（也兼容换行）：单邮箱 / Outlook 邮箱----密码----client_id----refresh_token / iCloud 邮箱----API_KEY或网页取件链接'
        required: true
        type: string
      forwarding_emails:
        description: '转发邮箱列表（每行或分号分隔的邮箱）。单邮箱账号将登录该转发箱并按收件人过滤'
        required: false
        default: 'TimmothyBegan9059@hotmail.com'
        type: string
      enable_mfa:
        description: '注册后开启 ChatGPT 两步验证'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.matrix.outputs.ids }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        name: 校验账号并生成矩阵
        shell: python
        env:
          ACCOUNTS: ${{ inputs.accounts }}
          FORWARDING_EMAILS: ${{ inputs.forwarding_emails }}
          FORWARD_MAILBOXES: ${{ secrets.FORWARD_MAILBOXES }}
        run: |
          import json
          import os
          import sys

          sys.path.insert(0, '.github/scripts')
          from account_input import parse_accounts, parse_email_list, resolve_forward_mailbox

          try:
              accounts = parse_accounts(os.environ['ACCOUNTS'])
              if any(len(account) == 1 for account in accounts):
                  forwarding = parse_email_list(os.environ.get('FORWARDING_EMAILS', ''))
                  if not forwarding:
                      raise ValueError('存在单邮箱账号时必须配置 forwarding_emails')
                  resolve_forward_mailbox(forwarding, os.environ.get('FORWARD_MAILBOXES', ''))
          except ValueError as error:
              raise SystemExit(str(error)) from None

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('ids=' + json.dumps(list(range(len(accounts))), separators=(',', ':')) + '\n')

  register:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        account_index: ${{ fromJson(needs.prepare-matrix.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取并保护账号配置
        id: account
        shell: python
        env:
          ACCOUNTS: ${{ inputs.accounts }}
          ACCOUNT_INDEX: ${{ matrix.account_index }}
          FORWARDING_EMAILS: ${{ inputs.forwarding_emails }}
          FORWARD_MAILBOXES: ${{ secrets.FORWARD_MAILBOXES }}
        run: |
          import os
          import sys

          sys.path.insert(0, '.github/scripts')
          from account_input import parse_accounts, parse_email_list, resolve_forward_mailbox

          fields = parse_accounts(os.environ['ACCOUNTS'])[int(os.environ['ACCOUNT_INDEX'])]
          values = {}
          if len(fields) == 1:
              forwarding = parse_email_list(os.environ.get('FORWARDING_EMAILS', ''))
              mailbox = resolve_forward_mailbox(forwarding, os.environ.get('FORWARD_MAILBOXES', ''))
              values = {
                  'EMAIL': fields[0],
                  'MAILBOX_EMAIL': mailbox[0],
                  'EMAIL_PASSWORD': mailbox[1],
                  'CLIENT_ID': mailbox[2],
                  'REFRESH_TOKEN': mailbox[3],
              }
          elif len(fields) == 2:
              values = {'EMAIL': fields[0], 'ICLOUD_API_KEY': fields[1]}
          else:
              values = {
                  'EMAIL': fields[0],
                  'EMAIL_PASSWORD': fields[1],
                  'CLIENT_ID': fields[2],
                  'REFRESH_TOKEN': fields[3],
              }

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              for name, value in values.items():
                  print(f'::add-mask::{value}')
                  env_file.write(f'{name}<<__ACCOUNT_VALUE__\n{value}\n__ACCOUNT_VALUE__\n')

      - name: 构建并运行 ChatGPT 注册
        env:
          ENABLE_CHATGPT_MFA: ${{ inputs.enable_mfa }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_HOST: us.rotgb.711proxy.com
          PROXY_PORT: '10000'
          PROXY_REGION: JP
          PROXY_SESS_TIME: '30'
          ACCOUNT_RESULT_PATH: step-summary
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install
          npm run build
          timeout -k 30s 300s node dist/app.js

      - name: 上传账号结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-summary-${{ matrix.account_index }}
          path: step-summary
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传注册过程证据
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.account_index }}
          path: evidence/
          retention-days: 7

  collect-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: register
    steps:
      - name: 下载所有账号结果
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: step-summary-*
          path: summaries

      - name: 合并结果
        shell: python
        run: |
          import os
          from pathlib import Path

          results = []
          for path in sorted(Path('summaries').rglob('step-summary')):
              if path.is_file():
                  for line in path.read_text(encoding='utf-8').splitlines():
                      if line.strip():
                          results.append(line.strip())

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              if results:
                  summary.write('\n'.join(results) + '\n')
