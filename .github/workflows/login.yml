name: ChatGPT login

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: '用于 run-name 的提交主题（非敏感）'
        required: true
        type: string
      accounts:
        description: '多个账号用英文分号 ; 分隔（也兼容换行）：email----password----2fa；第三段为 2FA 时忽略第四段及以后'
        required: true
        type: string
      enable_711_proxy:
        description: '启用 711Proxy 住宅代理（关闭则直连）'
        required: false
        default: false
        type: boolean
      proxy_region:
        description: '代理地区码（如 JP/PH；启用代理时必填）'
        required: false
        default: ''
        type: string
      proxy_username:
        description: '711Proxy 账号（与密码一起时走 sticky 拼装）'
        required: false
        default: ''
        type: string
      proxy_password:
        description: '711Proxy 密码'
        required: false
        default: ''
        type: string
      proxy_links:
        description: '代理链接列表（每行一条；多账号按序号轮询；失败不换 sticky）'
        required: false
        default: ''
        type: string
      hold_minutes:
        description: '成功后保持分钟数（先回传 token，再等待关闭）'
        required: false
        default: '15'
        type: choice
        options:
          - '0'
          - '5'
          - '10'
          - '15'
          - '30'
      payment_link_type:
        description: '支付提链类型'
        required: false
        default: '未选择'
        type: choice
        options:
          - 未选择
          - gcash
      payment_card:
        description: '支付提链卡密（选 gcash 时填写）'
        required: false
        default: ''
        type: string
      gc_ph_api_key:
        description: 'GC 菲律宾图片 API Key（选填；有值时截屏后上传并轮询）'
        required: false
        default: ''
        type: string
      web_task_id:
        description: '网页控制台任务 ID（有值时回传进度与 access token）'
        required: false
        default: ''
        type: string

run-name: ${{ inputs.commit_message }}

jobs:
  call:
    uses: ./.github/workflows/chatgpt-task.yml
    # 仓库默认 GITHUB_TOKEN 为 read；复用工作流无法自行抬权，调用方必须显式授予
    permissions:
      contents: read
      actions: write
    with:
      mode: login
      commit_message: ${{ inputs.commit_message }}
      accounts: ${{ inputs.accounts }}
      enable_711_proxy: ${{ inputs.enable_711_proxy }}
      proxy_region: ${{ inputs.proxy_region }}
      proxy_username: ${{ inputs.proxy_username }}
      proxy_password: ${{ inputs.proxy_password }}
      proxy_links: ${{ inputs.proxy_links }}
      hold_minutes: ${{ inputs.hold_minutes }}
      payment_link_type: ${{ inputs.payment_link_type }}
      payment_card: ${{ inputs.payment_card }}
      gc_ph_api_key: ${{ inputs.gc_ph_api_key }}
      web_task_id: ${{ inputs.web_task_id }}
    secrets: inherit
